<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IL2CPP Offset Viewer</title>
<style>
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --text:#c9d1d9; --dim:#8b949e; --accent:#58a6ff; --ok:#3fb950; --warn:#d29922; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; padding:24px; line-height:1.5; }
  h1 { font-size:20px; font-weight:600; margin-bottom:4px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:20px; }
  .drop { border:2px dashed var(--border); border-radius:8px; padding:32px; text-align:center; cursor:pointer; transition:.2s; background:var(--panel); margin-bottom:12px; }
  .drop:hover, .drop.over { border-color:var(--accent); background:#1c2128; }
  .drop.ok { border-color:var(--ok); }
  .drop .name { color:var(--accent); font-weight:600; margin-top:6px; font-size:13px; word-break:break-all; }
  .drop .hint { color:var(--dim); font-size:12px; margin-top:4px; }
  input[type=file] { display:none; }
  .controls { display:flex; gap:8px; margin:16px 0; flex-wrap:wrap; }
  input[type=text] { flex:1; min-width:200px; background:var(--panel); border:1px solid var(--border); color:var(--text); padding:8px 12px; border-radius:6px; font-size:13px; }
  input[type=text]:focus { outline:none; border-color:var(--accent); }
  button { background:var(--accent); color:#0d1117; border:none; padding:8px 16px; border-radius:6px; font-weight:600; font-size:13px; cursor:pointer; }
  button:disabled { background:var(--border); color:var(--dim); cursor:not-allowed; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--border); }
  .status { font-size:12px; color:var(--dim); margin:8px 0; min-height:18px; }
  .status.err { color:#f85149; }
  .status.ok { color:var(--ok); }
  .out { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:16px; max-height:60vh; overflow:auto; font-family:'Consolas','Courier New',monospace; font-size:12px; white-space:pre-wrap; word-break:break-all; }
  .out .cls { color:var(--accent); font-weight:600; }
  .out .mtd { color:var(--text); padding-left:16px; }
  .out .off { color:var(--warn); }
  .out .ns { color:var(--dim); }
  .count { color:var(--dim); font-size:11px; margin-bottom:8px; }
</style>
</head>
<body>
<h1>IL2CPP Offset Viewer</h1>
<div class="sub">Kéo <code>libil2cpp.so</code> + <code>global-metadata.dat</code> vào. Xử lý tại chỗ, không upload.</div>

<div class="drop" id="dropSo">
  <div>📦 Kéo <b>libil2cpp.so</b> vào đây</div>
  <div class="hint">hoặc bấm để chọn</div>
  <div class="name" id="nameSo"></div>
</div>
<input type="file" id="fileSo" accept=".so">

<div class="drop" id="dropMd">
  <div>📄 Kéo <b>global-metadata.dat</b> vào đây</div>
  <div class="hint">hoặc bấm để chọn</div>
  <div class="name" id="nameMd"></div>
</div>
<input type="file" id="fileMd" accept=".dat">

<div class="controls">
  <input type="text" id="kw" placeholder="Keyword: Player, Camera, Weapon..." value="Player">
  <button id="btnScan" disabled>Scan</button>
  <button id="btnClear" class="ghost">Clear</button>
</div>

<div class="status" id="status">Chưa có file.</div>
<div class="count" id="count"></div>
<div class="out" id="out"></div>

<script>
let bufSo = null, bufMd = null;
const $ = id => document.getElementById(id);

function bindDrop(dropId, inputId, nameId, setter) {
  const drop = $(dropId), input = $(inputId);
  drop.onclick = () => input.click();
  drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
  drop.ondragleave = () => drop.classList.remove('over');
  drop.ondrop = e => {
    e.preventDefault(); drop.classList.remove('over');
    if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0], drop, $(nameId), setter);
  };
  input.onchange = () => { if (input.files[0]) handleFile(input.files[0], drop, $(nameId), setter); };
}

function handleFile(file, drop, nameEl, setter) {
  const r = new FileReader();
  r.onload = () => {
    setter(new Uint8Array(r.result));
    nameEl.textContent = file.name + ' — ' + (file.size/1024/1024).toFixed(1) + ' MB';
    drop.classList.add('ok');
    checkReady();
  };
  r.readAsArrayBuffer(file);
}

function checkReady() {
  const ready = bufSo && bufMd;
  $('btnScan').disabled = !ready;
  if (ready) $('status').textContent = 'Sẵn sàng. Nhập keyword rồi Scan.';
}

bindDrop('dropSo','fileSo','nameSo', b => bufSo = b);
bindDrop('dropMd','fileMd','nameMd', b => bufMd = b);

// IL2CPP global-metadata magic: 0xFAB11BAF (little-endian: AF 1B B1 FA)
function checkMetadataMagic(buf) {
  if (buf.length < 4) return false;
  const magic = buf[0] | (buf[1]<<8) | (buf[2]<<16) | (buf[3]<<24);
  return (magic >>> 0) === 0xFAB11BAF;
}

// Trích string ASCII có độ dài >= minLen từ buffer — dùng cho .so
function extractStrings(buf, minLen=4) {
  const out = new Set();
  let cur = [];
  for (let i=0; i<buf.length; i++) {
    const c = buf[i];
    if (c >= 0x20 && c < 0x7f) {
      cur.push(c);
    } else {
      if (cur.length >= minLen) {
        out.add(String.fromCharCode(...cur));
      }
      cur = [];
    }
  }
  if (cur.length >= minLen) out.add(String.fromCharCode(...cur));
  return out;
}

// Tìm class/method trong metadata: parse sơ bộ string table
// IL2CPP metadata header (không mã hóa):
//   offset 0: magic (4)
//   offset 4: version (4)
//   offset 8: stringLiteralOffset (4)
//   ... nhiều trường khác
// String table (stringOffset, stringSize) nằm ở header offset 0x18 và 0x1C
// Đây là parse tối giản — đủ để lấy tên class cho bản metadata không mã hóa
function parseMetadataStrings(buf) {
  const view = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);
  if (buf.length < 0x20) return [];
  const strOff = view.getUint32(0x18, true);
  const strSize = view.getUint32(0x1C, true);
  if (strOff + strSize > buf.length || strSize === 0) return [];
  const strings = [];
  let i = strOff;
  const end = strOff + strSize;
  while (i < end) {
    let j = i;
    while (j < end && buf[j] !== 0) j++;
    if (j > i) {
      let s = '';
      for (let k=i; k<j; k++) {
        if (buf[k] >= 0x20 && buf[k] < 0x7f) s += String.fromCharCode(buf[k]);
      }
      if (s.length >= 2) strings.push(s);
    }
    i = j + 1;
  }
  return strings;
}

function scan() {
  const kw = $('kw').value.trim().toLowerCase();
  const out = $('out'), status = $('status'), countEl = $('count');
  out.innerHTML = ''; countEl.textContent = '';
  status.className = 'status';

  if (!bufSo || !bufMd) { status.textContent = 'Thiếu file.'; status.className='status err'; return; }

  // Kiểm tra metadata có bị mã hóa không
  const validMeta = checkMetadataMagic(bufMd);
  if (!validMeta) {
    status.textContent = '⚠ Metadata KHÔNG có magic 0xFAB11BAF — có thể bị mã hóa (FF Striped XOR). Đang fallback: scan string từ .so.';
    status.className = 'status err';
  } else {
    status.textContent = '✓ Metadata hợp lệ. Đang parse...';
    status.className = 'status ok';
  }

  // Chạy async để không block UI
  setTimeout(() => {
    let classNames = [];
    if (validMeta) {
      classNames = parseMetadataStrings(bufMd);
    }
    // Luôn scan .so để bổ sung
    const soStrings = extractStrings(bufSo, 4);
    const allStrings = new Set([...classNames, ...soStrings]);

    // Lọc theo keyword
    const matches = [];
    for (const s of allStrings) {
      if (s.toLowerCase().includes(kw)) {
        matches.push(s);
      }
    }
    matches.sort((a,b) => a.length - b.length);

    if (matches.length === 0) {
      status.textContent = `Không tìm thấy string chứa "${kw}".`;
      status.className = 'status err';
      return;
    }

    countEl.textContent = `${matches.length} string khớp "${kw}" (tổng ${allStrings.size} string quét được)`;
    status.textContent = validMeta ? '✓ Hoàn tất.' : '⚠ Hoàn tất (metadata mã hóa — chỉ string từ .so).';
    status.className = validMeta ? 'status ok' : 'status err';

    // Render
    const frag = document.createDocumentFragment();
    const MAX_SHOW = 500;
    for (let i=0; i<Math.min(matches.length, MAX_SHOW); i++) {
      const div = document.createElement('div');
      div.className = 'cls';
      div.textContent = matches[i];
      frag.appendChild(div);
    }
    if (matches.length > MAX_SHOW) {
      const more = document.createElement('div');
      more.className = 'ns';
      more.textContent = `... và ${matches.length - MAX_SHOW} string nữa (bị cắt để không treo trình duyệt)`;
      frag.appendChild(more);
    }
    out.appendChild(frag);
  }, 50);
}

$('btnScan').onclick = scan;
$('btnClear').onclick = () => {
  bufSo = bufMd = null;
  $('nameSo').textContent = ''; $('nameMd').textContent = '';
  $('dropSo').classList.remove('ok'); $('dropMd').classList.remove('ok');
  $('out').innerHTML = ''; $('count').textContent = '';
  $('status').textContent = 'Chưa có file.'; $('status').className = 'status';
  $('btnScan').disabled = true;
  $('fileSo').value = ''; $('fileMd').value = '';
};
$('kw').addEventListener('keydown', e => { if (e.key === 'Enter' && !$('btnScan').disabled) scan(); });
</script>
</body>
</html>
